{% extends "base.html" %}

{% block title %}Active Warrants{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12">
        <div class="card shadow mt-4">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Warrant Database</h4>
                
                <div class="d-flex gap-2">
                    <button id="options-btn" class="btn btn-warning fw-bold">⛯ Options API</button>
                    <a href="{% url 'warrant-create' %}" class="btn btn-light text-danger fw-bold">＋ Issue Warrant</a>
                </div>
            </div>

            <div class="card-body">
                <input type="text" id="search-box" class="form-control form-control-lg mb-4" placeholder="Search by Suspect, Crime, or Plate...">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Warrant ID</th>
                                <th>Suspect</th>
                                <th>Crime</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>

                    <div class="d-flex justify-content-between mt-3">
                        <button id="prev-btn" class="btn btn-secondary" disabled>Previous</button>
                        <span id="page-info" class="align-self-center fw-bold text-muted"></span>
                        <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
                    </div>
                </div>
                <div id="loading" class="text-center py-3" style="display: none;">
                    <div class="spinner-border text-danger" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tableBody = document.getElementById('table-body');
    const searchBox = document.getElementById('search-box');
    const loading = document.getElementById('loading');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');
    
    // Grab the new Options button
    const optionsBtn = document.getElementById('options-btn');

    let currentNext = null, currentPrev = null, searchTimeout = null;

    async function fetchData(url = '/api/warrant/') {
        loading.style.display = 'block';
        tableBody.innerHTML = '';
        try {
            const response = await fetch(url);
            const data = await response.json();

            renderTable(data.results);

            currentNext = data.next; currentPrev = data.previous;
            pageInfo.textContent = `Total Records: ${data.count}`;
            nextBtn.disabled = !currentNext; prevBtn.disabled = !currentPrev;
        } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error: ${err.message}</td></tr>`;
        } finally { loading.style.display = 'none'; }
    }

    function renderTable(items) {
        if(items.length === 0) { tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No warrants found.</td></tr>'; return; }
        items.forEach(w => {
            const statusBadge = w.status === 'O' ? 'bg-danger' : (w.status === 'P' ? 'bg-warning text-dark' : 'bg-success');
            tableBody.innerHTML += `
                <tr>
                    <td><span class="badge bg-dark">#${w.id}</span></td>
                    <td class="fw-bold">${w.citizen_name}</td>
                    <td>${w.crime_description}</td>
                    <td><span class="badge ${statusBadge}">${w.status_label}</span></td>
                    <td><a href="/warrants/${w.id}/" class="btn btn-sm btn-outline-danger">View</a></td>
                </tr>`;
        });
    }

    fetchData();

    nextBtn.addEventListener('click', () => { if (currentNext) fetchData(currentNext); });
    prevBtn.addEventListener('click', () => { if (currentPrev) fetchData(currentPrev); });
    
    searchBox.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const term = e.target.value.trim();
            fetchData(term ? `/api/warrant/?search=${encodeURIComponent(term)}` : '/api/warrant/');
        }, 300);
    });

    // --- NEW: Options Button Logic ---
    optionsBtn.addEventListener('click', async () => {
        try {
            const response = await fetch('/api/warrant/', {
                method: 'OPTIONS',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            
            // Format the JSON nicely so it's readable in the alert box
            alert("OPTIONS Response:\n\n" + JSON.stringify(data, null, 2));
        } catch (err) {
            alert("Error fetching OPTIONS: " + err.message);
        }
    });
});
</script>
{% endblock %}
