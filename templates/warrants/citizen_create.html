{% extends "base.html" %}

{% block title %}Citizen Intake{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mt-4">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">New Citizen Intake</h4>
            </div>
            <div class="card-body">
                <form id="create-citizen-form">
                    {% csrf_token %}

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" id="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="last_name" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Age</label>
                            <input type="number" id="age" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sex</label>
                            <select id="sex" class="form-select" required>
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="U">Unknown</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Race</label>
                            <select id="race" class="form-select" required>
                            <option value="" selected disabled>Select Race...</option>
                            <option value="BLACK">Black</option>
                            <option value="EAST_ASIAN">East Asian</option>
                            <option value="INDIGENOUS">Indigenous / Aboriginal</option>
                            <option value="LATINO">Latino / Hispanic</option>
                            <option value="MIDDLE_EASTERN">Middle Eastern</option>
                            <option value="SOUTH_ASIAN">South Asian</option>
                            <option value="SOUTHEAST_ASIAN">Southeast Asian</option>
                            <option value="WHITE">White</option>
                            <option value="PNTS">Prefer not to say</option>
                            <option value="UNKNOWN">Unknown</option>
                          </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notes / Marks / Scars</label>
                        <textarea id="details" class="form-control" rows="3"></textarea>
                    </div>

                    <hr>
                    <button type="submit" class="btn btn-success w-100">Create Record</button>
                    <a href="{% url 'citizen-list' %}" class="btn btn-link w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('create-citizen-form');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            age: parseInt(document.getElementById('age').value),
            sex: document.getElementById('sex').value,
            race: document.getElementById('race').value,
            details: document.getElementById('details').value
        };

        try {
            const response = await fetch('/api/citizen/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                window.location.href = "{% url 'citizen-list' %}";
            } else {
                const err = await response.json();
                alert('Error: ' + JSON.stringify(err));
            }
        } catch (error) {
            console.error(error);
            alert("Network error");
        }
    });
});
</script>
{% endblock %}
