{% extends "base.html" %}

{% block title %}Penal Code Reference{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow mt-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">📜 Penal Code Reference</h4>
                <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-light">Back to Dashboard</a>
            </div>
            
            <div class="card-body">
                <input type="text" id="search-input" class="form-control form-control-lg mb-4" placeholder="Search laws (e.g. 'Theft', '187'...)">

                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 15%">Section #</th>
                                <th>Description / Definition</th>
                            </tr>
                        </thead>
                        <tbody id="crime-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const tableBody = document.getElementById('crime-table-body');
    const searchInput = document.getElementById('search-input');
    let allCrimes = [];

    // 1. Fetch All Crimes
    try {
        const response = await fetch('/api/crime/'); // Ensure you have this Endpoint!
        if (!response.ok) throw new Error("Failed to load Penal Code");
        allCrimes = await response.json();
        renderTable(allCrimes);
    } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="2" class="text-danger">Error loading laws: ${err.message}</td></tr>`;
    }

    // 2. Filter Function
    function renderTable(data) {
        tableBody.innerHTML = '';
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No matching laws found.</td></tr>';
            return;
        }
        data.forEach(crime => {
            const row = `
                <tr>
                    <td><span class="badge bg-secondary fs-6">${crime.section_number}</span></td>
                    <td>${crime.description}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // 3. Search Logic
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allCrimes.filter(crime => 
            crime.section_number.toLowerCase().includes(term) || 
            crime.description.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });
});
</script>
{% endblock %}
