{% extends "base.html" %}

{% block title %}Plate {{ plate_id }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow mt-4">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0 text-center text-uppercase">Vehicle Registration</h4>
            </div>

            <div class="card-body text-center">
                <div class="display-4 fw-bold text-dark bg-warning border border-dark rounded p-2 mb-4 d-inline-block">
                    {{ plate_id }}
                </div>

                <div class="row text-start">
                    <div class="col-12 mb-3">
                        <label class="text-muted small text-uppercase">Vehicle</label>
                        <h3 id="vehicle-info">Loading...</h3>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="text-muted small text-uppercase">Registered Owner</label>
                        <h4 class="text-primary">
                            <a id="owner-link" href="#" class="text-decoration-none">Loading...</a>
                        </h4>
                    </div>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'plate-list' %}" class="btn btn-secondary">Back to List</a>
                    <div>
                        <a href="{% url 'plate-edit' plate_id %}" class="btn btn-warning me-2">Edit</a>
                        <button id="delete-btn" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const plateId = "{{ plate_id }}";

    try {
        const response = await fetch(`/api/license_plate/${plateId}/`);
        if(!response.ok) throw new Error("Plate not found");

        const data = await response.json();

        document.getElementById('vehicle-info').textContent = `${data.car_make} ${data.car_model}`;

        const ownerLink = document.getElementById('owner-link');
        ownerLink.textContent = data.owner_name;
        ownerLink.href = `/citizens/${data.owner}/`; // Link to Citizen Profile

        // Delete Logic
        document.getElementById('delete-btn').addEventListener('click', async () => {
            if(confirm("Delete this plate permanently?")) {
                await fetch(`/api/license_plate/${plateId}/`, {
                    method: 'DELETE',
                    headers: {'X-CSRFToken': '{{ csrf_token }}'}
                });
                window.location.href = "{% url 'plate-list' %}";
            }
        });

    } catch (err) {
        alert(err.message);
    }
});
</script>
{% endblock %}
