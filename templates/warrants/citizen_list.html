{% extends "base.html" %}

{% block title %}Citizen Database{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12">
        <div class="card shadow mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">👥 Civilian Database</h4>
                <a href="{% url 'citizen-create' %}" class="btn btn-light text-primary fw-bold">➕ New Booking / Intake</a>
            </div>
            
            <div class="card-body">
                <input type="text" id="search-box" class="form-control form-control-lg mb-4" placeholder="Search by Name (e.g. 'John Doe')...">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Age</th>
                                <th>Sex</th>
                                <th>Race</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="citizen-table-body">
                            </tbody>
                    </table>
                </div>
                <div id="loading" class="text-center py-3">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const tableBody = document.getElementById('citizen-table-body');
    const searchBox = document.getElementById('search-box');
    const loading = document.getElementById('loading');
    let allCitizens = [];

    // 1. Fetch All Citizens
    try {
        const response = await fetch('/api/citizen/');
        if (!response.ok) throw new Error("Failed to load database");
        allCitizens = await response.json();
        renderTable(allCitizens);
        loading.style.display = 'none';
    } catch (err) {
        loading.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
    }

    // 2. Render Function
    function renderTable(data) {
        tableBody.innerHTML = '';
        if(data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records found.</td></tr>';
            return;
        }

        data.forEach(c => {
            const row = `
                <tr>
                    <td><span class="badge bg-secondary">#${c.id}</span></td>
                    <td class="fw-bold">${c.first_name} ${c.last_name}</td>
                    <td>${c.age}</td>
                    <td>${c.sex_label}</td>
                    <td>${c.race_label}</td>
                    <td>
                        <a href="/citizens/${c.id}/" class="btn btn-sm btn-outline-primary">View Profile</a>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // 3. Search Logic
    searchBox.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allCitizens.filter(c => 
            c.first_name.toLowerCase().includes(term) || 
            c.last_name.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });
});
</script>
{% endblock %}
