{% extends "base.html" %}

{% block title %}Citizen Database{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12">
        <div class="card shadow mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Civilian Database</h4>
                <a href="{% url 'citizen-create' %}" class="btn btn-light text-primary fw-bold">＋ New Booking / Intake</a>
            </div>
            <div class="card-body">
                <input type="text" id="search-box" class="form-control form-control-lg mb-4" placeholder="Search by Name (e.g. 'John Doe')...">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Age</th>
                                <th>Sex</th>
                                <th>Race</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="citizen-table-body">
                        </tbody>
                    </table>
                    <div class="d-flex justify-content-between mt-3">
                        <button id="prev-btn" class="btn btn-secondary" disabled>Previous</button>
                        <span id="page-info" class="align-self-center fw-bold text-muted"></span>
                        <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
                    </div>
                </div>
                <div id="loading" class="text-center py-3" style="display: none;">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tableBody = document.getElementById('citizen-table-body');
    const searchBox = document.getElementById('search-box');
    const loading = document.getElementById('loading');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');

    let currentNext = null;
    let currentPrev = null;
    let searchTimeout = null;

    async function fetchCitizens(url = '/api/citizen/') {
        loading.style.display = 'block';
        tableBody.innerHTML = '';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Failed to load database");

            const data = await response.json();

            renderTable(data.results);

            // Update Pagination State
            currentNext = data.next;
            currentPrev = data.previous;
            pageInfo.textContent = `Total Records: ${data.count}`;

            nextBtn.disabled = !currentNext;
            prevBtn.disabled = !currentPrev;

        } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error: ${err.message}</td></tr>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderTable(citizens) {
        tableBody.innerHTML = '';
        if(citizens.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records found.</td></tr>';
            return;
        }

        citizens.forEach(c => {
            const row = `
                <tr>
                    <td><span class="badge bg-secondary">#${c.id}</span></td>
                    <td class="fw-bold">${c.first_name} ${c.last_name}</td>
                    <td>${c.age}</td>
                    <td>${c.sex_label || c.sex}</td>
                    <td>${c.race_label || c.race}</td>
                    <td>
                        <a href="/citizens/${c.id}/" class="btn btn-sm btn-outline-primary">View Profile</a>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    fetchCitizens();

    nextBtn.addEventListener('click', () => {
        if (currentNext) fetchCitizens(currentNext);
    });

    prevBtn.addEventListener('click', () => {
        if (currentPrev) fetchCitizens(currentPrev);
    });

    searchBox.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);

        // Wait 300ms after the user stops typing before hitting the API
        searchTimeout = setTimeout(() => {
            const term = e.target.value.trim();
            const url = term ? `/api/citizen/?search=${encodeURIComponent(term)}` : '/api/citizen/';
            fetchCitizens(url);
        }, 300); 
    });
});
</script>
{% endblock %}
