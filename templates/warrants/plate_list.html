{% extends "base.html" %}

{% block title %}License Plate Database{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12">
        <div class="card shadow mt-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Vehicle Database (DMV)</h4>
                <a href="{% url 'plate-create' %}" class="btn btn-success fw-bold">＋ Register Plate</a>
            </div>

            <div class="card-body">
                <input type="text" id="search-box" class="form-control form-control-lg mb-4" placeholder="Search Plate Number or Owner Name...">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Plate #</th>
                                <th>Vehicle</th>
                                <th>Registered Owner</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>

                    <div class="d-flex justify-content-between mt-3">
                        <button id="prev-btn" class="btn btn-secondary" disabled>Previous</button>
                        <span id="page-info" class="align-self-center fw-bold text-muted"></span>
                        <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
                    </div>
                </div>
                <div id="loading" class="text-center py-3" style="display: none;"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tableBody = document.getElementById('table-body');
    const searchBox = document.getElementById('search-box');
    const loading = document.getElementById('loading');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');

    let currentNext = null, currentPrev = null, searchTimeout = null;

    async function fetchData(url = '/api/license_plate/') {
        loading.style.display = 'block'; tableBody.innerHTML = '';
        try {
            const response = await fetch(url);
            const data = await response.json();
            renderTable(data.results);
            currentNext = data.next; currentPrev = data.previous;
            pageInfo.textContent = `Total Records: ${data.count}`;
            nextBtn.disabled = !currentNext; prevBtn.disabled = !currentPrev;
        } catch (err) { tableBody.innerHTML = `<tr><td colspan="4" class="text-danger text-center">Error: ${err.message}</td></tr>`; } 
        finally { loading.style.display = 'none'; }
    }

    function renderTable(items) {
        if(items.length === 0) { tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No plates found.</td></tr>'; return; }
        items.forEach(p => {
            tableBody.innerHTML += `
                <tr>
                    <td><span class="badge bg-warning text-dark fs-6 border border-dark">${p.plate_number}</span></td>
                    <td>${p.car_make} ${p.car_model}</td>
                    <td class="fw-bold text-primary">${p.owner_name}</td>
                    <td><a href="/plates/${p.plate_number}/" class="btn btn-sm btn-outline-dark">View</a></td>
                </tr>`;
        });
    }

    fetchData();

    nextBtn.addEventListener('click', () => { if (currentNext) fetchData(currentNext); });
    prevBtn.addEventListener('click', () => { if (currentPrev) fetchData(currentPrev); });
    searchBox.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const term = e.target.value.trim();
            fetchData(term ? `/api/license_plate/?search=${encodeURIComponent(term)}` : '/api/license_plate/');
        }, 300);
    });
});
</script>
{% endblock %}
