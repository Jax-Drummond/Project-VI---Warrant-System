{% extends "base.html" %}

{% block title %}Warrant #{{ warrant_id }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div id="loading" class="text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Retrieving Warrant #{{ warrant_id }}...</p>
        </div>

        <div id="content" class="card shadow" style="display: none;">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Warrant Details</h4>
                <div>
                    <span id="detail-status" class="badge bg-secondary me-2">Loading...</span>
                    <span id="detail-id" class="badge bg-light text-dark"></span>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold text-muted">Suspect Name</label>
                        <p id="detail-name" class="fs-5"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold text-muted">Crime / Charge</label>
                        <p id="detail-crime" class="fs-5 text-danger"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold text-muted">License Plates</label>
                        <div id="detail-plates"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold text-muted">Approving Judge</label>
                        <p id="detail-judge" class="fs-5"></p>
                    </div>
                </div>

                <hr>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'warrant-list' %}" class="btn btn-secondary">← Back to List</a>
                    <div>
                        <a href="{% url 'warrant-edit' warrant_id %}" class="btn btn-warning me-2">Edit Status</a>
                        <button id="delete-btn" class="btn btn-danger">Delete Warrant</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const warrantId = "{{ warrant_id }}";
    try {
        const response = await fetch(`/api/warrant/${warrantId}/`);
        if (!response.ok) throw new Error("Warrant not found");
        const data = await response.json();

        // 1. Fill Basic Data
        document.getElementById('detail-id').textContent = '#' + data.id;
        document.getElementById('detail-name').textContent = data.citizen_name;
        document.getElementById('detail-crime').textContent = data.crime_description;
        document.getElementById('detail-judge').textContent = data.approving_judge;

        // 2. Fill Status with Color Logic
        const statusEl = document.getElementById('detail-status');
        // Use status_label if available (e.g. "Active"), otherwise raw status
        const statusText = data.status_label || data.status || 'Unknown';
        statusEl.textContent = statusText;

        // Set Badge Color based on status text
        if (statusText === 'Active' || statusText === 'Open') {
            statusEl.classList.replace('bg-secondary', 'bg-danger');
        } else if (statusText === 'Closed' || statusText === 'Arrested') {
            statusEl.classList.replace('bg-secondary', 'bg-success');
        } else {
            statusEl.classList.replace('bg-secondary', 'bg-warning'); // Void/Other
            statusEl.classList.add('text-dark');
        }

        // 3. Fill Plates
        const platesDiv = document.getElementById('detail-plates');
        if (data.linked_plates && data.linked_plates.length > 0) {
            data.linked_plates.forEach(plate => {
                platesDiv.innerHTML += `<span class="badge bg-secondary me-1">${plate}</span>`;
            });
        } else {
            platesDiv.innerHTML = '<span class="text-muted">No known vehicles</span>';
        }

        // Show Card
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Handle Delete
        document.getElementById('delete-btn').addEventListener('click', async () => {
            if(confirm("Are you sure you want to delete this warrant?")) {
                await fetch(`/api/warrant/${warrantId}/`, {
                    method: 'DELETE',
                    headers: {'X-CSRFToken': '{{ csrf_token }}'}
                });
                window.location.href = "{% url 'warrant-list' %}";
            }
        });

    } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
    }
});
</script>
{% endblock %}
